<!-- ================= FLOATING CHAT WIDGET (WHATSAPP WEB-STYLE) ================= -->
<div id="chat-widget-container" class="chat-widget-container hidden">
    <!-- Botão de Ativação Flutuante -->
    <button class="chat-toggle-btn" id="chat-toggle-btn" aria-label="Abrir central de mensagens">
        <i data-lucide="message-square"></i>
        <span class="chat-badge hidden" id="chat-notif-badge">0</span>
    </button>
    
    <!-- Janela de Conversa Bipartida -->
    <div class="chat-window hidden" id="chat-window">
        <div class="chat-split-body">
            
            <!-- Coluna 1: Lista de Conversas (Contatos) -->
            <div class="chat-sidebar-contacts" id="chat-sidebar-contacts">
                <!-- Inserido dinamicamente via js/chat.js -->
            </div>
            
            <!-- Coluna 2: Conversa Ativa -->
            <div class="chat-active-pane">
                <!-- Cabeçalho da Conversa -->
                <div class="chat-header">
                    <div class="chat-user-status">
                        <span class="user-avatar" id="chat-active-avatar">?</span>
                        <div>
                            <h4 id="chat-active-name" style="margin: 0; font-size: 0.88rem; font-weight: 700; color: var(--color-text-main);">Selecione uma conversa</h4>
                            <!-- Contexto da conversa (o que está sendo negociado) — nunca "online/digitando" simulado -->
                            <span class="status-indicator" id="chat-active-status"></span>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <!-- Menu da conversa aberta: limpar histórico / excluir conversa -->
                        <div class="conv-menu">
                            <button type="button" class="conv-menu-toggle" data-conv-menu-toggle aria-label="Mais opções da conversa" title="Mais opções">⋯</button>
                            <div class="conv-menu-dropdown hidden">
                                <button type="button" data-conv-clear>Limpar histórico</button>
                                <button type="button" data-conv-hide>Excluir conversa</button>
                            </div>
                        </div>
                                            <button class="close-btn" id="chat-close-btn" aria-label="Fechar janela de mensagens" style="background: none; border: none; font-size: 1.4rem; font-weight: 700; color: var(--color-text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; transition: var(--transition);">&times;</button>
                    </div>
                </div>
                
                <!-- Corpo das Mensagens -->
                <div class="chat-body" id="chat-body-messages">
                    <!-- Inserido dinamicamente via js/chat.js -->
                </div>
                
                <!-- Prévia da imagem escolhida (antes de enviar) — o X remove a imagem -->
                <div class="chat-image-preview hidden" id="chat-image-preview">
                    <div class="chat-image-preview-box">
                        <img id="chat-image-preview-img" alt="Prévia da imagem que será enviada">
                        <button type="button" class="chat-image-preview-remove" id="chat-image-preview-remove" aria-label="Remover imagem">&times;</button>
                    </div>
                    <span class="chat-image-preview-hint">Imagem pronta. Escreva uma legenda (opcional) e envie.</span>
                </div>
                <input type="file" id="chat-image-input" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

                <!-- Assunto da próxima mensagem: só aparece quando há mais de uma doação/pedido com a mesma pessoa -->
                <div class="chat-thread-select-wrap hidden" id="chat-thread-select-wrap">
                    <label for="chat-thread-select">Enviar sobre:</label>
                    <select id="chat-thread-select" aria-label="Assunto da mensagem"></select>
                </div>

                <!-- Rodapé de Digitação -->
                <form class="chat-footer" id="chat-input-form">
                    <button type="button" class="chat-attach-btn" id="chat-attach-btn" aria-label="Enviar imagem" title="Enviar imagem">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </button>
                    <input type="text" id="chat-input-text" placeholder="Escreva uma mensagem..." autocomplete="off" aria-label="Texto da mensagem">
                    <button type="submit" class="btn btn-primary btn-icon" aria-label="Enviar mensagem" style="border-radius: var(--radius-round); width: 36px; height: 36px; padding: 0;">
                        <i data-lucide="send" style="width: 16px; height: 16px;"></i>
                    </button>
                </form>
            </div>
            
        </div>
    </div>
</div>
